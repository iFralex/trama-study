[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polimi-lectures"
version = "0.1.0"
description = "Archivio locale incrementale di registrazioni Polimi/Webex"
requires-python = ">=3.9"
dependencies = ["playwright>=1.48,<2", "httpx>=0.27,<1"]

[project.scripts]
polimi-lectures = "polimi_lectures.cli:main"

[tool.setuptools.packages.find]
include = ["polimi_lectures*"]
